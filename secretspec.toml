#:schema https://secretspec.dev/schema/secretspec.schema.json
[project]
name = "frcnixos-test"
revision = "1.0"

# file provide validates existence of files (for generated secrets), not SSH-ness
[providers]
devmach = "file:./.secrets"

[profiles.default]
MACH_INSTALL_KEY = { description = "Machines Install Key", type = "ssh_private_key", generate = true }
MACH_DEPLOY_KEY = { description = "Machines Deploy Key", type = "ssh_private_key", generate = true }

[profiles.devmach]
MACH_INSTALL_KEY = { providers = ["devmach"] }
MACH_DEPLOY_KEY = { providers = ["devmach"] }
