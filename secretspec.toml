#:schema https://secretspec.dev/schema/secretspec.schema.json
[project]
name = "frcnixos-test"
revision = "1.0"

[providers]
devmach = "file:./.secrets"
# TODO: sopsmac = "sops:./.secrets"

[profiles.default]
FOO = { description = "placeholder", required = false }

[profiles.devmach]
MACH_INSTALL_KEY = { description = "Machines Install Key", type = "ssh_private_key", generate = true, providers = ["devmach"], as_path = true }
MACH_DEPLOY_KEY = { description = "Machines Deploy Key", type = "ssh_private_key", generate = true, providers = ["devmach"], as_path = true }
THEIA_HOST_KEY = { description = "Theia Host Key", type = "ssh_private_key", generate = true, providers = ["devmach"], as_path = true }
