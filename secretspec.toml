#:schema https://secretspec.dev/schema/secretspec.schema.json
[project]
name = "frcnixos-test"
revision = "1.0"

[providers]
devmach = "file:./.secrets"

[profiles.default]
FOO = { description = "placeholder", required = false }

[profiles.devmach]
MACH_INSTALL_KEY = { description = "Machines Install Key", type = "ssh_private_key", generate = true, providers = ["devmach"] }
MACH_DEPLOY_KEY = { description = "Machines Deploy Key", type = "ssh_private_key", generate = true, providers = ["devmach"] }

# may fail, depending on the order
MACH_INSTALL_PUB = {
  description = "Machines Install Pubkey",
  type = "command",
  generate = { command = "secretspec get MACH_INSTALL_KEY | ssh-keygen -y -f /dev/stdin" }
  providers = ["devmach"],
}
MACH_DEPLOY_PUB = {
  description = "Machines Deploy Pubkey",
  type = "command",
  generate = { command = "secretspec get MACH_DEPLOY_KEY | ssh-keygen -y -f /dev/stdin" }
  providers = ["devmach"],
}
