# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
secretspec:
  enable: true
inputs:
  disko:
    url: github:nix-community/disko
    inputs:
      nixpkgs:
        follows: nixpkgs
  frc-nix:
    url: github:frc4451/frc-nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  sops-nix:
    url: github:Mic92/sops-nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  git-hooks:
    url: github:cachix/git-hooks.nix
